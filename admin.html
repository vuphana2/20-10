<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản trị - Pixel 20/10</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #171923;
      color: #f5f5f5;
    }

    main {
      max-width: 1000px;
      margin: 40px auto;
    }

    section {
      padding: 24px;
      margin-bottom: 20px;
      border: 1px solid #41445a;
      border-radius: 14px;
      background: #222536;
    }

    h1, h2 { color: #ffb7d5; }

    input, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #555a70;
      font-size: 16px;
    }

    input { background: #fff; color: #171923; }

    button {
      background: #ffb7d5;
      color: #171923;
      border: 0;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .6; cursor: wait; }

    #status { overflow-wrap: anywhere; }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #41445a;
      text-align: left;
    }

    th { color: #ffb7d5; }

    [hidden] { display: none !important; }
  </style>
</head>

<body>
<main>
  <h1>♡ Pixel 20/10 — Quản trị ♡</h1>

  <section id="login-panel">
    <h2>Đăng nhập quản trị</h2>

    <form id="login-form">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>

      <label for="password">Mật khẩu</label>
      <input id="password" type="password"
             autocomplete="current-password" required>

      <button id="login-button" type="submit">ĐĂNG NHẬP</button>
    </form>
  </section>

  <section id="data-panel" hidden>
    <h2>Danh sách người gửi</h2>
    <p id="total">Tổng số bản ghi: 0</p>

    <button id="refresh-button" type="button">LÀM MỚI DỮ LIỆU</button>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Tên</th>
            <th>Giới tính</th>
            <th>Thời gian gửi</th>
          </tr>
        </thead>
        <tbody id="visitor-list"></tbody>
      </table>
    </div>

    <button id="logout-button" type="button">ĐĂNG XUẤT</button>
  </section>

  <p id="status" role="status" aria-live="polite"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL =
    "https://yuydeejyktpiopcsaigz.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_bzGNIT7V-4C3ADTcB8O1Pw_9leCOmFC";

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const loginPanel = document.querySelector("#login-panel");
  const dataPanel = document.querySelector("#data-panel");
  const loginForm = document.querySelector("#login-form");
  const loginButton = document.querySelector("#login-button");
  const status = document.querySelector("#status");
  const visitorList = document.querySelector("#visitor-list");
  const total = document.querySelector("#total");

  async function loadVisitors() {
    status.textContent = "Đang tải dữ liệu...";
    visitorList.replaceChildren();

    const { data, error } = await db
      .from("visitors")
      .select("name, gender, created_at")
      .order("created_at", { ascending: false });

    if (error) {
      console.error("Lỗi tải dữ liệu:", error);
      status.textContent =
        "Không thể đọc dữ liệu. Hãy kiểm tra UID, quyền SELECT và RLS.";
      return;
    }

    for (const visitor of data) {
      const tr = document.createElement("tr");

      const nameCell = document.createElement("td");
      nameCell.textContent = visitor.name ?? "";

      const genderCell = document.createElement("td");
      genderCell.textContent =
        visitor.gender === "female" ? "Nữ" :
        visitor.gender === "male" ? "Nam" :
        visitor.gender ?? "";

      const timeCell = document.createElement("td");
      const date = new Date(visitor.created_at);
      timeCell.textContent = Number.isNaN(date.getTime())
        ? ""
        : date.toLocaleString("vi-VN");

      tr.append(nameCell, genderCell, timeCell);
      visitorList.appendChild(tr);
    }

    total.textContent = `Tổng số bản ghi: ${data.length}`;
    status.textContent = "Đã tải dữ liệu thành công.";
  }

  async function updatePage() {
    const { data: { session }, error } =
      await db.auth.getSession();

    if (error) {
      status.textContent = "Không kiểm tra được phiên đăng nhập.";
      return;
    }

    const loggedIn = Boolean(session);

    loginPanel.hidden = loggedIn;
    dataPanel.hidden = !loggedIn;

    if (loggedIn) {
      await loadVisitors();
    }
  }

  loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    loginButton.disabled = true;
    status.textContent = "Đang đăng nhập...";

    try {
      const { error } = await db.auth.signInWithPassword({
        email: document.querySelector("#email").value.trim(),
        password: document.querySelector("#password").value
      });

      if (error) {
        status.textContent = "Đăng nhập thất bại. Hãy kiểm tra email và mật khẩu.";
        return;
      }

      await updatePage();
    } catch (error) {
      console.error(error);
      status.textContent = "Có lỗi kết nối. Hãy thử lại.";
    } finally {
      loginButton.disabled = false;
    }
  });

  document.querySelector("#refresh-button")
    .addEventListener("click", loadVisitors);

  document.querySelector("#logout-button")
    .addEventListener("click", async () => {
      const { error } = await db.auth.signOut();

      if (error) {
        status.textContent = "Đăng xuất thất bại.";
        return;
      }

      visitorList.replaceChildren();
      total.textContent = "Tổng số bản ghi: 0";
      loginPanel.hidden = false;
      dataPanel.hidden = true;
      status.textContent = "Bạn đã đăng xuất.";
    });

  updatePage();
</script>
</body>
</html>
